  - heading: "3. THE BLOOMBERG TYPOGRAPHIC RULE"
    content: "To eliminate typographical friction and maintain Tier-1 journalistic parity, all inline trademark symbols (™ and ®) MUST be purged from headings and narrative body text. Proprietary assets must be presented in strict Title Case."
  - heading: "4. EXECUTION TEMPLATE (TRADEMARK FOOTER)"
    execution_template: >
      **Important notice regarding intellectual property and trademarks.**

      Woodfine Capital Projects, Woodfine Management Corp, PointSav Digital Systems, Totebox Orchestration, and Totebox Archive are trademarks owned by Woodfine Capital Projects Inc. This notice serves as a formal declaration of intellectual property rights, asserting continuous use in commerce regardless of the omission of the ™ symbol in the accompanying text. All operational and architectural system designations (including but not limited to PointSav Console OS, PointSav Infrastructure OS, PointSav MediaKit OS, PointSav Network OS, PointSav PrivateGit OS, PointSav Workplace OS, and Totebox OS) are proprietary structural wordmarks utilized exclusively within the PointSav Digital Systems architecture.
  - heading: "5. TERMINAL EGRESS FORMATTING"
    content: "Rely purely on standard Markdown hierarchy for document structure; maintain clean, utilitarian visual egress. Do not append standard structural Markdown tags like '###' at the bottom of public egress documents."
    merged_from: "ds-protocol-guide.yaml, 2026-07-21 (file deleted same commit — its other rule, the Bloomberg Typographic Rule, was already covered near-verbatim by section 3 above, so only this genuinely new rule was carried forward). FLAGGED, NOT RESOLVED: this directly contradicts DS-TKN-MEDIA-RELEASE.html, which ships a trailing '###' terminator — per project-editorial's 2026-07-15 audit, needs an operator/counsel call, not silently resolved by this merge."
